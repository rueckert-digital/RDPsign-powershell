<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Create DEFAULT.RDP in Remote Desktop Connection</title>
  <desc id="desc">Illustration of mstsc.exe with Computer, User name, and Save As highlighted.</desc>
  <defs>
    <linearGradient id="win" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef3fb"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/></filter>
  </defs>
  <rect width="920" height="520" fill="#0f172a" rx="24"/>
  <text x="46" y="58" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="28" font-weight="700">🧩 Create DEFAULT.RDP</text>
  <text x="46" y="92" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="16">mstsc.exe → Show Options → fill Computer/User → Save As…</text>
  <g filter="url(#shadow)" transform="translate(46 120)">
    <rect width="828" height="340" rx="14" fill="url(#win)" stroke="#cbd5e1"/>
    <rect width="828" height="40" rx="14" fill="#e2e8f0"/>
    <circle cx="790" cy="20" r="7" fill="#ef4444"/><circle cx="765" cy="20" r="7" fill="#f59e0b"/><circle cx="740" cy="20" r="7" fill="#22c55e"/>
    <text x="22" y="27" fill="#0f172a" font-family="Segoe UI, Arial" font-size="16" font-weight="600">Remote Desktop Connection</text>
    <text x="34" y="78" fill="#1d4ed8" font-family="Segoe UI, Arial" font-size="31" font-weight="700">Remotedesktop Verbindung</text>
    <rect x="28" y="105" width="772" height="198" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="54" y="142" fill="#111827" font-family="Segoe UI, Arial" font-size="16" font-weight="600">Anmeldeeinstellungen</text>
    <text x="96" y="181" fill="#111827" font-family="Segoe UI, Arial" font-size="15">Computer:</text>
    <rect x="230" y="158" width="438" height="34" rx="4" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="242" y="181" fill="#0f172a" font-family="Consolas, monospace" font-size="15">HOST_OR_IP</text>
    <text x="96" y="226" fill="#111827" font-family="Segoe UI, Arial" font-size="15">Benutzername:</text>
    <rect x="230" y="203" width="438" height="34" rx="4" fill="#fff" stroke="#64748b"/>
    <text x="242" y="226" fill="#0f172a" font-family="Consolas, monospace" font-size="15">DOMAIN\user</text>
    <rect x="52" y="257" width="18" height="18" rx="3" fill="#2563eb"/><path d="M56 266l4 4 8-10" fill="none" stroke="#fff" stroke-width="2"/>
    <text x="80" y="272" fill="#111827" font-family="Segoe UI, Arial" font-size="14">Speichern der Anmeldeinformationen zulassen</text>
    <rect x="28" y="315" width="772" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="54" y="350" fill="#111827" font-family="Segoe UI, Arial" font-size="15">Verbindungseinstellungen</text>
    <rect x="514" y="333" width="118" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="540" y="353" fill="#1d4ed8" font-family="Segoe UI, Arial" font-size="14" font-weight="600">Save As…</text>
    <path d="M580 365 C590 405,620 418,655 420" fill="none" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
    <text x="665" y="426" fill="#fbbf24" font-family="Segoe UI, Arial" font-size="18" font-weight="700">Desktop\DEFAULT.RDP</text>
  </g>
</svg>
